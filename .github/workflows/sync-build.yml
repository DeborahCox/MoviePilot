name: Sync upstream and build image

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Rebuild image even if the release tag already exists'
        type: boolean
        default: false
      release_version:
        description: 'Immutable fork release version (for example v3.2.8-1)'
        type: string
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-build-${{ inputs.release_version != '' && 'release' || 'sync' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/deborahcox/moviepilot
  FRONTEND_REPO: DeborahCox/MoviePilot-Frontend
  FRONTEND_REF: v3
  UPSTREAM_REPO: jxxghp/MoviePilot

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork v3
        uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase onto upstream v3
        id: sync
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git
          git fetch upstream v3
          NEW_COMMITS=$(git rev-list --count HEAD..upstream/v3)
          echo "upstream new commits: ${NEW_COMMITS}"
          if [ "${NEW_COMMITS}" = "0" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rebase upstream/v3
          git push --force-with-lease origin v3
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "sync updated: ${{ steps.sync.outputs.updated }}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: sync
    if: github.event_name != 'workflow_dispatch' || inputs.release_version == ''
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r '.tag_name')
          test -n "${TAG}" && test "${TAG}" != "null"
          echo "upstream latest release: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Skip if image tag already exists
        id: image
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:deborahcox/moviepilot:pull&service=ghcr.io" | jq -r '.token')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/deborahcox/moviepilot/manifests/${{ steps.release.outputs.tag }}")
          echo "manifest status: ${CODE}"
          if [ "${CODE}" = "200" ] && [ "${FORCE_BUILD}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout backend (fork v3)
        if: steps.image.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 1

      - name: Checkout frontend (fork v3)
        if: steps.image.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: frontend-src
          fetch-depth: 0

      - name: Sync frontend with upstream
        if: steps.image.outputs.build == 'true'
        working-directory: frontend-src
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/jxxghp/MoviePilot-Frontend.git
          git fetch upstream v3
          NEW_COMMITS=$(git rev-list --count HEAD..upstream/v3)
          echo "frontend upstream new commits: ${NEW_COMMITS}"
          if [ "${NEW_COMMITS}" != "0" ]; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" rebase upstream/v3
          fi

      - name: Set up Node
        if: steps.image.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        if: steps.image.outputs.build == 'true'
        run: corepack enable

      - name: Cache yarn dependencies
        if: steps.image.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            frontend-src/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend-src/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Build frontend dist
        if: steps.image.outputs.build == 'true'
        working-directory: frontend-src
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --network-timeout 600000 2>&1 | grep -v "Workspaces can only be enabled in private projects."
          yarn_rc=${PIPESTATUS[0]}
          [ "${yarn_rc}" -eq 0 ] || { echo "yarn install failed (rc=${yarn_rc})"; exit "${yarn_rc}"; }
          yarn build
          test -f dist/index.html
          mkdir -p "$GITHUB_WORKSPACE/frontend-dist"
          cp -a dist/. "$GITHUB_WORKSPACE/frontend-dist/"

      - name: Set up QEMU
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: steps.image.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=ghcr.io/deborahcox/moviepilot:buildcache
          cache-to: type=registry,ref=ghcr.io/deborahcox/moviepilot:buildcache,mode=max
          build-args: |
            MOVIEPILOT_PYTHON_VARIANT=standard
          labels: |
            org.opencontainers.image.description=MoviePilot fork build with connectivity-test patch

  publish-update:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        env:
          TAG: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v3\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo 'Use v3.x.y-N for a fork release' >&2; exit 1; }

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 0
          fetch-tags: true

      - name: Verify backend version and unused tag
        env:
          TAG: ${{ inputs.release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -c 'import os, version; assert version.APP_VERSION == os.environ["TAG"] == version.FRONTEND_VERSION, "version.py must declare the requested release for both components"'
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null &&
             [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Tag $TAG points to a different commit" >&2; exit 1
          fi
          response=$(mktemp)
          status=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$response" 2>/dev/null && echo 200 || awk 'NR == 1 {print $2}' "$response")
          if [ "$status" = 200 ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.draft' | grep -qx true || { echo "Published release $TAG is immutable" >&2; exit 1; }
          elif [ "$status" != 404 ]; then
            echo "Unable to inspect release: HTTP $status" >&2; exit 1
          fi

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: frontend-src
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend release
        working-directory: frontend-src
        env:
          TAG: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          corepack enable
          yarn install --frozen-lockfile --network-timeout 600000
          yarn build
          test -f dist/index.html
          printf '%s\n' "$TAG" > dist/version.txt
          zip -qr "$GITHUB_WORKSPACE/dist.zip" dist

      - name: Publish draft and immutable tag
        env:
          TAG: ${{ inputs.release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$(git rev-parse HEAD)"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist.zip --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes "Fork release $TAG"
          fi

      - name: Verify release asset and publish
        env:
          TAG: ${{ inputs.release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected="sha256:$(sha256sum dist.zip | awk '{print $1}')"
          actual=''
          for attempt in {1..12}; do
            actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name == "dist.zip") | .digest')
            [ "$actual" = "$expected" ] && break
            sleep 5
          done
          test "$actual" = "$expected"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
