name: Sync upstream and build image

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Rebuild image even if the release tag already exists'
        type: boolean
        default: false
      release_revision:
        description: 'New Fork revision number (leave empty for automatic upstream releases)'
        type: string
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-build-v3
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/deborahcox/moviepilot
  FRONTEND_REPO: DeborahCox/MoviePilot-Frontend
  FRONTEND_REF: v3
  UPSTREAM_REPO: jxxghp/MoviePilot

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ steps.sync.outputs.sha }}
      upstream_tag: ${{ steps.release.outputs.tag }}
      upstream_release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout fork v3
        uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve upstream release commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r '.tag_name')
          [[ "$TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]] || { echo "Unsupported upstream tag: $TAG" >&2; exit 1; }
          echo "upstream latest release: ${TAG}"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/upstream-release"
          release_commit=$(git rev-parse 'refs/tags/upstream-release^{commit}')
          if [[ "$(git log -1 --format=%s "$release_commit")" == 'build(plugin-market): sync default from MoviePilot-Wiki@'* ]]; then
            release_commit=$(git rev-parse "$release_commit^1")
          fi
          echo "release commit: ${release_commit}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${release_commit}" >> "$GITHUB_OUTPUT"

      - name: Merge upstream release commit
        id: sync
        run: |
          set -euo pipefail
          RELEASE_SHA="${{ steps.release.outputs.sha }}"
          if git merge-base --is-ancestor "$RELEASE_SHA" HEAD; then
            echo "fork v3 already contains upstream release ${RELEASE_SHA}"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git merge --no-edit "$RELEASE_SHA"
            git push origin HEAD:v3
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "upstream release: ${{ steps.release.outputs.tag }} @ ${{ steps.release.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "sync updated: ${{ steps.sync.outputs.updated }}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: sync
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ needs.sync.outputs.backend_sha }}
      frontend_sha: ${{ steps.frontend.outputs.sha }}
      upstream_tag: ${{ steps.release.outputs.tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      built: ${{ steps.image.outputs.build }}
    steps:
      - name: Resolve upstream latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ inputs.release_revision }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ needs.sync.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]] || { echo "Unsupported upstream tag: $TAG" >&2; exit 1; }
          echo "upstream latest release: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          [[ -z "$REVISION" || "$REVISION" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid revision' >&2; exit 1; }
          FINAL_REVISION="$REVISION"
          if [[ -z "$FINAL_REVISION" ]]; then
            # 未指定版本时按现有尾缀解析：手动触发 +1 发新版；定时触发保持最新尾缀，只刷新镜像不新建 release。
            tags=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
            # grep 无匹配时返回 1，在 pipefail 下会中止脚本；用 || true 吞掉，让 ${max:-...} 兜底生效。
            max=$(printf '%s\n' "$tags" | grep -E "^${TAG}-[0-9]+$" | sed -E "s/^${TAG}-//" | sort -n | tail -1 || true)
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              FINAL_REVISION=$(( ${max:-0} + 1 ))
            else
              FINAL_REVISION="${max:-1}"
            fi
          fi
          # 无任何历史尾缀时定时回落到 1，保证 release tag 始终有效。
          FINAL_REVISION="${FINAL_REVISION:-1}"
          [[ "$FINAL_REVISION" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid resolved revision: $FINAL_REVISION" >&2; exit 1; }
          echo "release revision: ${FINAL_REVISION} (event=${EVENT_NAME}, requested=${REVISION:-auto})"
          echo "release_tag=${TAG}-${FINAL_REVISION}" >> "$GITHUB_OUTPUT"

      - name: Skip if image tag already exists
        id: image
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if ! grep -Fxq "$RELEASE_TAG" <<< "$releases"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:deborahcox/moviepilot:pull&service=ghcr.io" | jq -r '.token')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/deborahcox/moviepilot/manifests/${{ steps.release.outputs.tag }}")
          echo "manifest status: ${CODE}"
          if [ "${CODE}" = "200" ] && [ "${FORCE_BUILD}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout backend (fork v3)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.backend_sha }}
          fetch-depth: 0

      - name: Verify backend release ancestry
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/$TAG:refs/tags/upstream-release"
          release_commit=$(git rev-parse 'refs/tags/upstream-release^{commit}')
          if [[ "$(git log -1 --format=%s "$release_commit")" == 'build(plugin-market): sync default from MoviePilot-Wiki@'* ]]; then
            release_commit=$(git rev-parse "$release_commit^1")
          fi
          git merge-base --is-ancestor "$release_commit" HEAD || { echo 'Backend Fork does not contain the upstream release' >&2; exit 1; }
          TAG="$TAG" python3 -c 'import os, version; assert version.APP_VERSION == version.FRONTEND_VERSION == os.environ["TAG"], "Fork v3 version does not match upstream release"'

      - name: Checkout frontend (fork v3)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: frontend-src
          fetch-depth: 0

      - name: Pin and verify frontend Fork
        id: frontend
        working-directory: frontend-src
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/jxxghp/MoviePilot-Frontend.git "refs/tags/$TAG:refs/tags/upstream-release"
          git merge-base --is-ancestor refs/tags/upstream-release HEAD || { echo "Frontend Fork does not contain upstream release $TAG" >&2; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            frontend-src/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend-src/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Build frontend dist
        working-directory: frontend-src
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --network-timeout 600000 2>&1 | grep -v "Workspaces can only be enabled in private projects."
          yarn_rc=${PIPESTATUS[0]}
          [ "${yarn_rc}" -eq 0 ] || { echo "yarn install failed (rc=${yarn_rc})"; exit "${yarn_rc}"; }
          curl -fsSL --retry 3 "https://github.com/jxxghp/MoviePilot-Plugins/archive/refs/heads/main.zip" -o "$RUNNER_TEMP/plugin-icons.zip"
          unzip -q "$RUNNER_TEMP/plugin-icons.zip" 'MoviePilot-Plugins-main/icons/*' -d "$RUNNER_TEMP/plugin-icons"
          cp -a "$RUNNER_TEMP/plugin-icons/MoviePilot-Plugins-main/icons" public/plugin_icon
          MOVIEPILOT_BUILD_VERSION="$RELEASE_TAG" yarn build
          test -f dist/index.html
          test -f dist/plugin_icon/Chatgpt_A.png
          printf '%s\n' "$RELEASE_TAG" > dist/version.txt
          mkdir -p "$GITHUB_WORKSPACE/frontend-dist"
          cp -a dist/. "$GITHUB_WORKSPACE/frontend-dist/"
          zip -qr "$GITHUB_WORKSPACE/dist.zip" dist

      - name: Share exact frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: dist.zip
          retention-days: 1

      - name: Pin site resources
        id: resources
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/jxxghp/MoviePilot-Resources.git refs/heads/main | awk '{print $1}')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Stamp image release version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 -c 'import os, pathlib, re; p=pathlib.Path("version.py"); s=p.read_text(); s,n=re.subn(r"^(APP_VERSION|FRONTEND_VERSION)\s*=\s*[^\n]+", lambda m: m.group(1)+" = \x27"+os.environ["RELEASE_TAG"]+"\x27", s, flags=re.M); assert n == 2; p.write_text(s)'
          python3 -c 'import os, version; assert version.APP_VERSION == version.FRONTEND_VERSION == os.environ["RELEASE_TAG"]'

      - name: Set up QEMU
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: steps.image.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.release.outputs.release_tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=ghcr.io/deborahcox/moviepilot:buildcache
          cache-to: type=registry,ref=ghcr.io/deborahcox/moviepilot:buildcache,mode=max
          build-args: |
            MOVIEPILOT_PYTHON_VARIANT=standard
            MOVIEPILOT_RESOURCES_REF=${{ steps.resources.outputs.sha }}
          labels: |
            org.opencontainers.image.description=MoviePilot fork build with connectivity-test patch
            org.moviepilot.resources-revision=${{ steps.resources.outputs.sha }}

  publish-update:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned backend
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.backend_sha }}
          fetch-depth: 0
      - name: Download tested frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-release

      - name: Create immutable release
        env:
          UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          FRONTEND_SHA: ${{ needs.build.outputs.frontend_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if grep -Fxq "$TAG" <<< "$releases"; then
            echo "Release $TAG already published; leaving it unchanged"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Existing tag $TAG requires manual inspection; refusing to overwrite" >&2; exit 1
          fi
          backend_sha=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TAG="$TAG" python3 -c 'import os, pathlib, re; p=pathlib.Path("version.py"); s=p.read_text(); s,n=re.subn(r"^(APP_VERSION|FRONTEND_VERSION)\s*=\s*[^\n]+", lambda m: m.group(1)+" = \x27"+os.environ["TAG"]+"\x27", s, flags=re.M); assert n == 2; p.write_text(s)'
          git add version.py
          git commit -m "chore(release): prepare $TAG"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          notes=$(printf 'Upstream: %s\nBackend source: %s\nFrontend source: %s\n' "$UPSTREAM_TAG" "$backend_sha" "$FRONTEND_SHA")
          gh release create "$TAG" dist.zip --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes "$notes"
          expected="sha256:$(sha256sum dist.zip | awk '{print $1}')"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          test -n "$release_id"
          actual=''
          for attempt in {1..12}; do
            actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.assets[] | select(.name == "dist.zip") | .digest')
            [ "$actual" = "$expected" ] && break
            sleep 5
          done
          test "$actual" = "$expected"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
